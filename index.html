<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Assistente Visual por Gestos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #000;
            color: white;
            overflow: hidden; /* Impede rolagem para focar nos gestos */
            height: 100vh;
            width: 100vw;
        }

        /* O vídeo ocupa a tela toda */
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        canvas { display: none; }

        /* Área de toque invisível que cobre tudo */
        #touch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Fica acima do vídeo */
            /* Gradiente suave apenas para indicar que está ativo (opcional) */
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent, rgba(0,0,0,0.3));
        }

        /* Feedback visual centralizado (opcional, para baixa visão) */
        #status-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 24px;
            display: none; /* Só aparece quando algo acontece */
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="touch-layer"></div>

    <div id="status-display"></div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const statusDiv = document.getElementById("status-display");
        const touchLayer = document.getElementById("touch-layer");

        let lastDescription = "Nenhuma descrição feita ainda. Arraste para a direita para começar.";
        let isProcessing = false;

        // --- 1. CONFIGURAÇÃO DE VOZ (TTS) ---
        function falar(texto) {
            // Cancela falas anteriores para não encavalar
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1; // Um pouco mais rápido para ser ágil
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }

        function mostrarStatus(texto) {
            statusDiv.innerText = texto;
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
        }

        // --- 2. CÂMERA ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;
                
                // Instrução inicial ao abrir o app
                setTimeout(() => {
                    falar("Assistente iniciado. Arraste o dedo para a direita para descrever o ambiente. Arraste para a esquerda para repetir.");
                }, 1000);

            } catch (err) {
                falar("Erro ao acessar a câmera. Verifique as permissões.");
            }
        }

        // --- 3. SISTEMA DE GESTOS (SWIPE) ---
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        touchLayer.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, false);

        touchLayer.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            handleGesture();
        }, false);

        function handleGesture() {
            const minSwipeDistance = 50; // Distância mínima para considerar um arraste
            const horizontalDist = touchEndX - touchStartX;
            const verticalDist = touchEndY - touchStartY;

            // Verifica se o movimento foi mais horizontal que vertical
            if (Math.abs(horizontalDist) > Math.abs(verticalDist)) {
                
                // SWIPE DIREITA (Valor Positivo) -> ANALISAR
                if (horizontalDist > minSwipeDistance) {
                    executarAnalise();
                }
                
                // SWIPE ESQUERDA (Valor Negativo) -> REPETIR
                else if (horizontalDist < -minSwipeDistance) {
                    repetirDescricao();
                }
            }
        }

        // --- 4. AÇÕES ---

        function vibrar() {
            if (navigator.vibrate) navigator.vibrate(200); // Vibração curta
        }

        function repetirDescricao() {
            vibrar();
            mostrarStatus("🔄 Repetindo...");
            falar(lastDescription);
        }

        async function executarAnalise() {
            if (isProcessing) return; // Evita cliques duplos
            isProcessing = true;
            
            vibrar();
            falar("Analisando..."); // Feedback imediato
            mostrarStatus("👁️ Analisando...");

            // Captura frame
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.7);

            try {
                // Chama sua API (A mesma que configuramos antes)
                const response = await fetch('/api/identify-environment', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: imageDataUrl })
                });

                if (!response.ok) throw new Error("Erro na API");

                const data = await response.json();
                
                // Guarda e Fala
                lastDescription = data.description;
                falar(lastDescription);
                mostrarStatus(lastDescription);

            } catch (error) {
                falar("Não consegui identificar. Tente novamente.");
            } finally {
                isProcessing = false;
            }
        }

        // Inicia
        startCamera();
    </script>
</body>
</html>
