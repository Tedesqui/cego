<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Assistente de Visão - Multimodo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap');
        body, html { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: black; color: white; overflow: hidden; height: 100vh; width: 100vw; touch-action: pan-y; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        canvas { display: none; }
        #ui-container { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 10; pointer-events: none; }
        #gesture-feedback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 25px 40px; border-radius: 20px; font-size: 24px; text-align: center; color: #fff; z-index: 100; display: none; border: 3px solid #4CAF50; box-shadow: 0 0 20px rgba(0,0,0,0.5); font-weight: bold; }
        #controls { padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0)); text-align: center; pointer-events: auto; }
        button#captureBtn { background-color: #4CAF50; color: white; padding: 15px 30px; border: none; border-radius: 50px; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 90%; }
        #output-panel { background: #111; padding: 20px; max-height: 80vh; overflow-y: auto; box-sizing: border-box; border-top: 2px solid #4CAF50; pointer-events: auto; padding-bottom: 50px; }
        .description-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .description-card h2 { margin-top: 0; color: #4CAF50; font-size: 1.4em; } 
        .description-card p { line-height: 1.6; font-size: 1.2em; color: #eee; }
        .status-text { text-align: center; padding: 20px; font-size: 1.3em; font-weight: bold; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="gesture-feedback"></div>

    <div id="ui-container">
        <div id="output-panel" style="display:none;"></div>
        <div id="controls">
            <button id="captureBtn">Arraste 👉 ou Toque Duplo 👆👆</button>
        </div>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const outputPanel = document.getElementById("output-panel");
        const controlsDiv = document.getElementById("controls");
        const captureBtn = document.getElementById("captureBtn");
        const feedbackBox = document.getElementById("gesture-feedback");

        let lastDescription = "Nenhuma descrição disponível ainda.";
        let isProcessing = false;

        function speakText(text) {
            if (window.Android && window.Android.falar) {
                window.Android.falar(text);
            } else if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR'; 
                utterance.rate = 1.1; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function showFeedback(text) {
            feedbackBox.innerText = text;
            feedbackBox.style.display = 'block';
            if (navigator.vibrate) navigator.vibrate(70);
            setTimeout(() => { feedbackBox.style.display = 'none'; }, 2000);
        }

        async function startCamera() { 
            try { 
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } }); 
                video.srcObject = stream; 
                setTimeout(() => {
                    speakText("Assistente pronto. Arraste para a direita para detalhes, ou dê dois toques rápidos para resumo.");
                }, 1000);
            } catch (err) { speakText("Erro na câmera."); } 
        }

        function resetUI() {
            canvas.style.display = 'none';
            video.style.display = 'block';
            outputPanel.style.display = 'none';
            controlsDiv.style.display = 'block';
            captureBtn.disabled = false;
            isProcessing = false;
            
            showFeedback("📸 Câmera Pronta");
            speakText("Câmera Pronta.");
        }

        // --- NOVA ANÁLISE: RECEBE O "MODO" (detailed ou short) ---
        async function analyzeScene(retryCount = 0, mode = 'detailed') {
            if (isProcessing && retryCount === 0) return;
            isProcessing = true;

            if (retryCount === 0) {
                captureBtn.disabled = true;
                
                // Feedback diferente dependendo do modo
                if (mode === 'short') {
                    showFeedback("⚡ Análise Rápida...");
                    speakText("Análise Rápida...");
                } else {
                    showFeedback("👁️ Analisando Detalhes...");
                    speakText("Analisando Detalhes...");
                }
                
                video.style.display = 'none';
                canvas.style.display = 'block';
                controlsDiv.style.display = 'none';
                outputPanel.style.display = 'block';
                outputPanel.innerHTML = `<div class="status-text">Processando...</div>`;
            }

            const MAX_WIDTH = 800; 
            const scale = MAX_WIDTH / video.videoWidth;
            canvas.width = MAX_WIDTH;
            canvas.height = video.videoHeight * scale;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const imageDataUrl = canvas.toDataURL('image/jpeg', 0.70);
                
                // ENVIAMOS O 'MODE' JUNTO COM A IMAGEM PARA A API
                const response = await fetch('/api/identify-environment', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageDataUrl, mode: mode }), 
                });

                if (!response.ok) throw new Error("Erro na API");
                const data = await response.json();
                
                lastDescription = data.description || "Sem descrição.";
                renderResult(lastDescription);
                speakText(lastDescription);
                isProcessing = false;

            } catch (error) {
                if (retryCount < 2) {
                    setTimeout(() => { analyzeScene(retryCount + 1, mode); }, 1000);
                } else {
                    speakText("A inteligência artificial demorou muito. Tente de novo.");
                    outputPanel.innerHTML = `<div class="status-text" style="color:red;">Tempo esgotado.</div>`;
                    setTimeout(resetUI, 4500);
                }
            }
        }

        function renderResult(text) {
            outputPanel.innerHTML = `
                <div class="description-card"><h2>Descrição</h2><p>${text}</p></div>
                <div style="text-align: center; color: #999; margin-top: 20px;">👈 Repetir | 👉 Foto Nova | 👆👆 Foto Rápida</div>
            `;
        }

        // --- SISTEMA DE GESTOS E TOQUE DUPLO ---
        let touchStartX = 0;
        let touchStartY = 0;
        let lastTapTime = 0; // Guarda o tempo do último toque

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const horizontalDist = touchEndX - touchStartX;
            const verticalDist = touchEndY - touchStartY;
            const currentTime = new Date().getTime();

            // 1. É UM SWIPE? (Arraste longo horizontal)
            if (Math.abs(horizontalDist) > Math.abs(verticalDist) && Math.abs(horizontalDist) > 60) {
                lastTapTime = 0; // Cancela toque duplo
                
                if (horizontalDist > 0) {
                    // ARRASTE DIREITA 👉 (Detalhado)
                    if (outputPanel.style.display === 'block') resetUI();
                    else if (!isProcessing) analyzeScene(0, 'detailed');
                } else {
                    // ARRASTE ESQUERDA 👈 (Repetir)
                    showFeedback("🔄 Repetindo...");
                    speakText(lastDescription);
                }
            } 
            // 2. É UM TOQUE? (O dedo mal se moveu do lugar)
            else if (Math.abs(horizontalDist) < 20 && Math.abs(verticalDist) < 20) {
                const tapLength = currentTime - lastTapTime;
                
                // Se o tempo entre o último toque e este for menor que 400 milissegundos
                if (tapLength < 400 && tapLength > 0) {
                    // TOQUE DUPLO DETECTADO 👆👆 (Curto)
                    lastTapTime = 0; // Reseta o relógio
                    
                    if (outputPanel.style.display === 'block') resetUI();
                    if (!isProcessing) analyzeScene(0, 'short');
                } else {
                    // Primeiro toque, guarda o tempo
                    lastTapTime = currentTime;
                }
            }
        }, {passive: false});

        captureBtn.addEventListener('click', () => { if (!isProcessing) analyzeScene(0, 'detailed'); });
        startCamera();
    </script>
</body>
</html>
